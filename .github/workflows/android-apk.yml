name: Build Nova Scientific APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaScientific-CloudBuild.zip'
      - '.github/workflows/android-apk.yml'
    branches: [ main, master, 'arena/0e6d24dd-nova-calculatrice-scientifique' ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Nova Scientific APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          test -f NovaScientific-CloudBuild.zip
          unzip -q NovaScientific-CloudBuild.zip -d source
          test -f source/NovaScientific/gradlew
          test -f source/NovaScientific/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Test calculation parser
        working-directory: source/NovaScientific
        run: node TEST_PARSER.js

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build debug APK
        working-directory: source/NovaScientific
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            details=$(tail -n 100 build.log | sed ':a;N;$!ba;s/
/%0A/g')
            echo "::error title=Gradle build failed::$details"
          fi
          exit "$result"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaScientific-debug-apk
          path: source/NovaScientific/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
