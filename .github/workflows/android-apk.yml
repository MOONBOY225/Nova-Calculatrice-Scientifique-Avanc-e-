name: Build Nova Scientific APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaScientific-CloudBuild.zip'
      - '.github/workflows/android-apk.yml'
    branches: [ main, master, 'arena/0e6d24dd-nova-calculatrice-scientifique' ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Nova Scientific APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          test -f NovaScientific-CloudBuild.zip
          unzip -q NovaScientific-CloudBuild.zip -d source
          test -f source/NovaScientific/gradlew
          test -f source/NovaScientific/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Test calculation parser
        working-directory: source/NovaScientific
        run: |
          node TEST_PARSER.js
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
          node TEST_APP.js

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test native and Java arithmetic
        working-directory: source/NovaScientific
        run: |
          cargo test --manifest-path native/rust/Cargo.toml
          mkdir -p /tmp/nova-java-tests
          javac -d /tmp/nova-java-tests app/src/main/java/com/moonboy/scicalc/BaseConverter.java tests/BaseConverterTest.java
          java -cp /tmp/nova-java-tests BaseConverterTest
          g++ -std=c++17 -O2 tests/integer_math_test.cpp -o /tmp/nova-integer-test
          /tmp/nova-integer-test

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build debug APK
        working-directory: source/NovaScientific
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            details=$(tr '\r' '\n' < build.log | grep -iE 'error|failed|exception|could not|what went wrong|failure|curl:' | head -n 30 | tr '\n' '|')
            echo "::error title=Gradle build failed::$details"
          fi
          exit "$result"

      - name: Report APK size
        run: |
          apk=source/NovaScientific/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "APK debug : $bytes octets (arm64-v8a)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Taille APK::APK debug arm64 : $bytes octets"
          test "$bytes" -ge 20000000 || { echo "::error::APK inférieure à 20 Mo (20 000 000 octets)"; exit 1; }
          unzip -l "$apk" | grep -F 'assets/books/la-voie-du-nombre.pdf'
          unzip -l "$apk" | grep -F 'assets/books/guide-accompagnateur.pdf' 

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaScientific-debug-apk
          path: source/NovaScientific/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
